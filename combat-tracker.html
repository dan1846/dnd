<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Combat Log">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#141517">
<title>Combat Log — D&D 2024</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#141517;--bg2:#1b1d20;--bg3:#22252a;--bg4:#2a2e34;
  --fg:#d4d4d8;--fg2:#a1a1aa;--fg3:#71717a;--fg4:#52525b;
  --border:#2e3138;--border2:#3f4451;
  --accent:#7c9aff;--accent2:#5b7cfa;--accent-dim:rgba(124,154,255,0.12);
  --red:#f87171;--red-dim:rgba(248,113,113,0.12);
  --green:#4ade80;--green-dim:rgba(74,222,128,0.12);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,0.12);
  --action:#7c9aff;--bonus:#c084fc;--reaction:#fb923c;
  --radius:4px;
  --toggle-bg:var(--bg3);--toggle-fg:var(--fg3);
  --left-w:330px;
  --round-w:200px;
  --lair-h:40px;
  --head-h:34px;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;
  background:var(--bg);color:var(--fg);
  font-family:'SF Mono','Menlo','Courier New',monospace;font-size:13px;}
.light{
  --bg:#f4f4f5;--bg2:#ffffff;--bg3:#e8e8ec;--bg4:#d4d4d8;
  --fg:#1c1c1e;--fg2:#3a3a3c;--fg3:#6b6b6f;--fg4:#8e8e93;
  --border:#d1d1d6;--border2:#b0b0b6;
  --accent:#4a6cf7;--accent2:#3b5ce4;--accent-dim:rgba(74,108,247,0.10);
  --red:#dc2626;--red-dim:rgba(220,38,38,0.08);
  --green:#16a34a;--green-dim:rgba(22,163,74,0.08);
  --amber:#ca8a04;--amber-dim:rgba(202,138,4,0.08);
  --action:#4a6cf7;--bonus:#9333ea;--reaction:#ea580c;
  --toggle-bg:var(--bg3);--toggle-fg:var(--fg3);
}

.app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);background:var(--bg2);}

/* iOS Safari: prevent scroll-into-view jump when focusing inputs. */
@keyframes _ios_no_scroll{0%{opacity:0}100%{opacity:1}}
input:focus{animation:_ios_no_scroll 0.01s;}

/* -- HEADER -- */
.hdr{display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--bg2);border-bottom:2px solid var(--border2);flex-shrink:0;flex-wrap:wrap;}
.hdr-title{font-family:'Avenir Next','Helvetica Neue',Helvetica,sans-serif;
  font-weight:800;font-size:15px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--fg);white-space:nowrap;}
.hdr-ed{font-size:9px;color:var(--fg4);font-family:'Avenir Next',sans-serif;margin-left:-6px;}
.hdr-field{display:flex;align-items:center;gap:4px;}
.hdr-field.grow{flex:1;min-width:100px;}
.lbl{font-family:'Avenir Next','Helvetica Neue',sans-serif;font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.08em;color:var(--fg3);white-space:nowrap;}
.hdr-input{background:transparent;border:none;border-bottom:1px solid var(--border);
  color:var(--fg);font-family:inherit;font-size:12px;padding:2px 4px;outline:none;min-width:0;}
.hdr-input:focus{border-bottom-color:var(--accent);}
.hdr-field.grow .hdr-input{width:100%;}
.hdr-input.sm{width:60px;}
.lr-box{display:flex;align-items:center;gap:5px;border:1.5px solid var(--border2);
  border-radius:var(--radius);padding:2px 8px;white-space:nowrap;}
.lr-box .lbl{font-size:8px;}

/* -- TOOLBAR -- */
.toolbar{display:flex;align-items:center;gap:6px;padding:6px 12px;
  background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.btn{font-family:'Avenir Next','Helvetica Neue',sans-serif;font-size:11px;font-weight:600;
  padding:6px 12px;border:1px solid var(--border2);border-radius:var(--radius);
  background:var(--bg3);color:var(--fg2);cursor:pointer;white-space:nowrap;
  min-height:36px;touch-action:manipulation;transition:background 0.15s,border-color 0.15s;}
.btn:active{background:var(--bg4);border-color:var(--fg4);}
.btn:disabled{opacity:0.35;cursor:default;pointer-events:none;}
.btn.primary{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.btn.primary:active{background:rgba(124,154,255,0.25);}
.btn.danger{background:var(--red-dim);border-color:rgba(248,113,113,0.3);color:var(--red);}
.btn.danger:active{background:rgba(248,113,113,0.25);}
.btn.export{border-color:var(--green);color:var(--green);background:var(--green-dim);}
.btn.export:active{background:rgba(74,222,128,0.25);}
.btn.sm-btn{padding:6px 8px;min-height:36px;}
.toolbar .spacer{flex:1;}
.round-indicator{font-family:'Avenir Next',sans-serif;font-size:12px;font-weight:700;
  color:var(--accent);letter-spacing:0.04em;}
.btn-group{display:flex;gap:2px;align-items:center;}
.btn.theme-toggle{font-size:15px;padding:6px 10px;line-height:1;}

/* -- TWO-PANEL GRID -- */
.grid-container{flex:1;display:flex;overflow:hidden;}

.grid-left{width:var(--left-w);min-width:var(--left-w);flex-shrink:0;
  display:flex;flex-direction:column;border-right:2px solid var(--border2);background:var(--bg);}
.grid-left-head{height:var(--head-h);min-height:var(--head-h);display:flex;align-items:center;
  background:var(--bg3);border-bottom:2px solid var(--border2);flex-shrink:0;}
.grid-left-body{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;
  padding-bottom:env(safe-area-inset-bottom,0px);}
.grid-left-body::-webkit-scrollbar{display:none;}
.grid-left-body{-ms-overflow-style:none;scrollbar-width:none;}

.grid-right{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.grid-right-head{height:var(--head-h);min-height:var(--head-h);
  background:var(--bg3);border-bottom:2px solid var(--border2);flex-shrink:0;overflow:hidden;}
.grid-right-body{flex:1;overflow:auto;overscroll-behavior:none;
  padding-bottom:env(safe-area-inset-bottom,0px);}

.head-cell{display:flex;align-items:center;justify-content:center;height:100%;
  font-family:'Avenir Next',sans-serif;font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.06em;color:var(--fg3);}
.head-init{width:52px;min-width:52px;}
.head-ac{width:46px;min-width:46px;}
.head-info{flex:1;padding-left:6px;justify-content:flex-start;}
.head-round{width:var(--round-w);min-width:var(--round-w);flex-shrink:0;}

.rn{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--fg4);
  font-size:11px;font-weight:700;color:var(--fg2);cursor:pointer;}
.rn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}

.round-head-inner{display:flex;min-width:max-content;}
.rounds-inner{display:flex;min-width:max-content;}

/* -- ROW -- */
.row-left,.row-right{display:flex;border-bottom:1px solid var(--border);}
.row-left.even,.row-right.even{background:var(--bg2);}
.row-left.lair,.row-right.lair{min-height:var(--lair-h);
  background:var(--bg3)!important;border-bottom:2px solid var(--border2);}

.cell-init{width:52px;min-width:52px;display:flex;align-items:flex-start;
  justify-content:center;padding:6px 2px;border-right:1px solid var(--border);}
.cell-ac{width:46px;min-width:46px;display:flex;align-items:flex-start;
  justify-content:center;padding:6px 2px;border-right:1px solid var(--border);}
.cell-info{flex:1;padding:4px 6px;min-width:0;overflow:hidden;position:relative;}

.num-input{width:40px;height:36px;text-align:center;background:transparent;border:none;
  color:var(--fg);font-family:inherit;font-size:14px;font-weight:700;outline:none;
  border-radius:var(--radius);}
.num-input:focus{background:var(--bg4);}
.num-input::placeholder{color:var(--fg4);}

.name-input{width:calc(100% - 28px);background:transparent;border:none;border-bottom:1px solid var(--border);
  color:var(--fg);font-family:inherit;font-size:13px;font-weight:700;padding:2px 0;
  outline:none;height:26px;}
.name-input:focus{border-bottom-color:var(--accent);}
.name-input::placeholder{color:var(--fg4);font-weight:400;}

.info-row{display:flex;align-items:center;gap:3px;min-height:22px;}
.info-input{background:transparent;border:none;border-bottom:1px solid var(--border);
  color:var(--fg);font-family:inherit;font-size:11px;padding:1px 2px;outline:none;text-align:center;}
.info-input:focus{border-bottom-color:var(--accent);}
.info-input.w-sm{width:30px;}
.info-input.w-lg{width:100%;text-align:left;}
.slash{color:var(--fg4);font-size:11px;}

.chk{-webkit-appearance:none;appearance:none;width:18px;height:18px;border:1.5px solid var(--fg4);
  border-radius:2px;background:transparent;cursor:pointer;flex-shrink:0;position:relative;}
.chk:checked{background:var(--accent);border-color:var(--accent);}
.chk:checked::after{content:'\2713';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);font-size:12px;color:#fff;font-weight:700;}
.chk.round{border-radius:50%;}
.chk.success:checked{background:var(--green);border-color:var(--green);}
.chk.fail{border-style:dashed;}
.chk.fail:checked{background:var(--red);border-color:var(--red);}
.death-group{display:flex;align-items:center;gap:2px;}
.death-sep{color:var(--fg4);font-size:10px;margin:0 2px;}

.row-delete{position:absolute;right:2px;top:2px;width:22px;height:22px;border:none;
  background:transparent;color:var(--fg4);font-size:16px;cursor:pointer;border-radius:50%;
  display:flex;align-items:center;justify-content:center;opacity:0.35;
  transition:opacity 0.15s,background 0.15s,color 0.15s;}
.cell-info:hover .row-delete{opacity:1;}
.row-delete:active{background:var(--red-dim);color:var(--red);opacity:1;}
@media (pointer:coarse){.row-delete{opacity:0.5;}}

.cell-round{width:var(--round-w);min-width:var(--round-w);flex-shrink:0;
  border-left:1px solid var(--border);padding:4px 6px;}
.action-line{display:flex;align-items:center;gap:4px;min-height:26px;}
.action-tag{font-family:'Avenir Next',sans-serif;font-size:10px;font-weight:800;
  text-transform:uppercase;width:14px;flex-shrink:0;text-align:center;}
.action-tag.a{color:var(--action);}
.action-tag.b{color:var(--bonus);}
.action-tag.r{color:var(--reaction);}
.action-input{flex:1;background:transparent;border:none;
  border-bottom:1px dashed var(--border);color:var(--fg);font-family:inherit;
  font-size:11px;padding:2px 2px;outline:none;min-width:0;height:24px;}
.action-input:focus{border-bottom-color:var(--fg3);border-bottom-style:solid;}
.action-input::placeholder{color:var(--fg4);font-size:10px;}
.free-line{display:flex;align-items:center;gap:3px;min-height:22px;}
.free-label{width:28px;flex-shrink:0;background:transparent;border:none;
  border-bottom:1px solid var(--border);color:var(--fg2);font-family:inherit;
  font-size:10px;padding:1px 2px;outline:none;text-align:center;
  text-transform:uppercase;font-weight:700;height:20px;}
.free-label:focus{border-bottom-color:var(--accent);}
.free-label::placeholder{color:var(--fg4);}
.free-desc{flex:1;background:transparent;border:none;
  border-bottom:1px dashed var(--border);color:var(--fg);font-family:inherit;
  font-size:11px;padding:2px 2px;outline:none;min-width:0;height:20px;}
.free-desc:focus{border-bottom-color:var(--fg3);}

.lair-left{display:flex;align-items:center;gap:8px;padding:0 8px;flex:1;}
.lair-label{font-family:'Avenir Next',sans-serif;font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:0.06em;color:var(--fg2);}
.lair-cell{display:flex;align-items:center;justify-content:center;gap:6px;
  width:var(--round-w);min-width:var(--round-w);flex-shrink:0;
  border-left:1px solid var(--border);padding:4px 6px;}
.lair-sep{color:var(--fg4);font-size:12px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;
  display:none;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;
  padding:20px 24px;max-width:340px;width:90%;text-align:center;}
.modal h3{font-family:'Avenir Next',sans-serif;font-size:15px;font-weight:700;
  color:var(--fg);margin-bottom:8px;}
.modal p{font-size:12px;color:var(--fg2);margin-bottom:16px;}
.modal-btns{display:flex;gap:8px;justify-content:center;}

.grid-right-body::-webkit-scrollbar{width:6px;height:6px;}
.grid-right-body::-webkit-scrollbar-track{background:var(--bg);}
.grid-right-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}

#print-view{display:none;}

@media print{
  @page{size:letter landscape;margin:0.25in;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  html,body{background:#fff!important;color:#111!important;font-size:8pt!important;overflow:visible!important;height:auto!important;}
  :root{--bg:#fff;--bg2:#fff;--bg3:#fff;--bg4:#fff;}
  .app,.modal-overlay{display:none!important;}
  #print-view{display:block!important;font-family:'Courier New',Courier,monospace;font-size:8pt;color:#111;background:#fff!important;}

  .p-hdr{display:flex;align-items:baseline;gap:8px;border-bottom:2.5px solid #111;padding-bottom:3px;margin-bottom:2px;}
  .p-title{font-family:'Arial Black',Helvetica,sans-serif;font-size:11pt;font-weight:900;
    letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap;}
  .p-lbl{font-family:Arial,sans-serif;font-size:6pt;font-weight:700;text-transform:uppercase;
    letter-spacing:0.08em;color:#555;white-space:nowrap;}
  .p-val{font-size:8pt;margin-left:2px;}
  .p-hdr-f{display:flex;align-items:baseline;gap:4px;}
  .p-hdr-f.grow{flex:1;}

  .p-legend{font-family:Arial,sans-serif;font-size:5pt;color:#555;padding:1px 0;
    margin-bottom:1px;border-bottom:1px solid #b0b0b0;}

  .p-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:7.5pt;}
  .p-table th{font-family:Arial,sans-serif;font-size:5.5pt;font-weight:700;text-transform:uppercase;
    letter-spacing:0.06em;color:#555;border-bottom:2px solid #333;padding:1px 2px 2px;
    text-align:center;vertical-align:bottom;}
  .p-table th.al{text-align:left;}
  .p-table td{border-bottom:1px solid #b0b0b0;padding:2px 3px;vertical-align:top;font-size:7.5pt;}
  .p-table tr:nth-child(even) td{background:#f2f2f2;}

  .p-table .c-init,.p-table .c-ac{text-align:center;width:30px;border-right:1px solid #b0b0b0;}
  .p-table .c-info{width:140px;border-right:1.5px solid #333;font-size:7pt;line-height:1.3;}
  .p-table .c-round{border-left:1px solid #b0b0b0;font-size:6.5pt;line-height:1.4;white-space:pre-line;}

  .p-rn{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
    border-radius:50%;border:1.5px solid #111;font-family:'Courier New',monospace;
    font-size:7.5pt;font-weight:700;}

  .p-info-line{margin:0;padding:0;}
  .p-tag{font-family:Arial,sans-serif;font-size:5.5pt;font-weight:800;text-transform:uppercase;color:#555;}

  .p-lair td{background:#f2f2f2!important;border-bottom:1.5px solid #333;border-top:1.5px solid #333;
    font-family:Arial,sans-serif;font-size:6pt;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;}
  .p-chk{display:inline-block;width:7px;height:7px;border:1.2px solid #111;border-radius:1px;
    vertical-align:middle;margin:0 1px;}
  .p-chk.checked{background:#111;}
  .p-chk.round{border-radius:50%;}
  .p-chk.dashed{border-style:dashed;}
}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <span class="hdr-title">Combat Log</span>
    <span class="hdr-ed">2024</span>
    <div class="hdr-field grow">
      <span class="lbl">Encounter</span>
      <input class="hdr-input" id="h-encounter" placeholder="—" aria-label="Encounter name">
    </div>
    <div class="hdr-field grow">
      <span class="lbl">Player</span>
      <input class="hdr-input" id="h-player" placeholder="—" aria-label="Player name">
    </div>
    <div class="hdr-field">
      <span class="lbl">Session</span>
      <input class="hdr-input sm" id="h-session" placeholder="—" aria-label="Session number">
    </div>
    <div class="lr-box">
      <span class="lbl" style="font-size:8px;">Legendary Res.</span>
      <span id="lr-checks"></span>
    </div>
  </div>

  <div class="toolbar">
    <div class="btn-group">
      <button class="btn primary" id="btn-add-combatant">+ Combatant</button>
      <button class="btn sm-btn" id="btn-rm-combatant" title="Remove last combatant" aria-label="Remove last combatant">&minus;</button>
    </div>
    <div class="btn-group">
      <button class="btn" id="btn-add-round">+ Round</button>
      <button class="btn sm-btn" id="btn-rm-round" title="Remove last round" aria-label="Remove last round">&minus;</button>
    </div>
    <button class="btn" id="btn-sort-init">Sort Init &darr;</button>
    <span class="spacer"></span>
    <span class="round-indicator" id="round-ind">Round 1</span>
    <button class="btn" id="btn-prev-round" aria-label="Previous round">&lsaquo;</button>
    <button class="btn primary" id="btn-next-round">Next &rsaquo;</button>
    <span class="spacer"></span>
    <button class="btn danger" id="btn-clear-all">Clear All</button>
    <button class="btn theme-toggle" id="btn-theme" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">☀</button>
    <button class="btn export" id="btn-print-export">Save PDF</button>
  </div>

  <div class="grid-container" role="grid" aria-label="Combat tracker">
    <div class="grid-left">
      <div class="grid-left-head" role="row">
        <div class="head-cell head-init" role="columnheader">Init</div>
        <div class="head-cell head-ac" role="columnheader">AC</div>
        <div class="head-cell head-info" role="columnheader">Combatant Info</div>
      </div>
      <div class="grid-left-body" id="left-body"></div>
    </div>
    <div class="grid-right">
      <div class="grid-right-head" id="right-head"></div>
      <div class="grid-right-body" id="right-body"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h3 id="modal-title">Clear All Data?</h3>
    <p>This removes all combatants, rounds, and header info. Cannot be undone.</p>
    <div class="modal-btns">
      <button class="btn" id="btn-modal-cancel">Cancel</button>
      <button class="btn danger" id="btn-modal-confirm">Clear</button>
    </div>
  </div>
</div>

<div id="print-view"></div>

<script>

const STORAGE_KEY='dnd2024-combat-log';
const THEME_KEY='dnd2024-theme';
const STATE_VERSION=2;

function applyTheme(theme){
  document.documentElement.classList.toggle('light',theme==='light');
  document.getElementById('btn-theme').textContent=theme==='light'?'☾':'☀';
  const mc=document.querySelector('meta[name="theme-color"]');
  if(mc)mc.content=theme==='light'?'#ffffff':'#141517';
}
function toggleTheme(){
  const next=document.documentElement.classList.contains('light')?'dark':'light';
  try{localStorage.setItem(THEME_KEY,next);}catch(e){}
  applyTheme(next);
}
(function(){const t=localStorage.getItem(THEME_KEY);if(t)applyTheme(t);})();

let state=loadState();

function defaultState(){return{_v:STATE_VERSION,encounter:'',player:'',session:'',currentRound:1,numRounds:3,
  legendaryRes:[false,false,false,false,false],lairInit:'',combatants:defaultCombatants(),lair:{},legendary:{}};}
function defaultCombatants(){const a=[];for(let i=0;i<4;i++)a.push(newCombatant());return a;}
function newCombatant(){return{id:crypto.randomUUID(),init:'',ac:'',name:'',hp:'',maxHp:'',thp:'',spd:'',conc:'',
  deathS:[false,false,false],deathF:[false,false,false],inspiration:false,rounds:{}};}
function getRound(c,r){return c.rounds[r]||{action:'',bonus:'',reaction:'',freeLabel:'',freeDesc:''};}
function ensureRound(c,r){if(!c.rounds[r])c.rounds[r]={action:'',bonus:'',reaction:'',freeLabel:'',freeDesc:''};return c.rounds[r];}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const s=JSON.parse(raw);
      const def=defaultState();
      return{
        _v:STATE_VERSION,
        encounter:s.encounter||'',player:s.player||'',session:s.session||'',
        currentRound:s.currentRound||1,
        numRounds:s.numRounds||def.numRounds,
        legendaryRes:Array.isArray(s.legendaryRes)&&s.legendaryRes.length===5?s.legendaryRes:def.legendaryRes,
        lairInit:s.lairInit||'',
        lair:s.lair||{},legendary:s.legendary||{},
        combatants:(Array.isArray(s.combatants)?s.combatants:def.combatants).map(c=>({
          ...newCombatant(),...c,
          id:c.id||crypto.randomUUID(),
          deathS:Array.isArray(c.deathS)&&c.deathS.length===3?c.deathS:[false,false,false],
          deathF:Array.isArray(c.deathF)&&c.deathF.length===3?c.deathF:[false,false,false],
          rounds:c.rounds||{}
        }))
      };
    }
  }catch(e){}
  return defaultState();
}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
let saveTimer=null;
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveState,300);}
function flushSave(){clearTimeout(saveTimer);saveState();}

function getActiveFieldId(){
  const el=document.activeElement;
  if(!el||!el.matches('input'))return null;
  return el.dataset.fieldId||null;
}
function restoreFocus(fieldId){
  if(!fieldId)return;
  requestAnimationFrame(()=>{
    const el=document.querySelector('[data-field-id="'+fieldId+'"]');
    if(el){el.focus();
      if(typeof el.selectionStart==='number')el.selectionStart=el.selectionEnd=el.value.length;}
  });
}

function setupScrollSync(){
  const rb=document.getElementById('right-body');
  const lb=document.getElementById('left-body');
  const rh=document.getElementById('right-head');
  let syncing=false;
  rb.addEventListener('scroll',()=>{
    if(syncing)return;syncing=true;
    lb.scrollTop=rb.scrollTop;rh.scrollLeft=rb.scrollLeft;
    syncing=false;
  },{passive:true});
  lb.addEventListener('scroll',()=>{
    if(syncing)return;syncing=true;
    rb.scrollTop=lb.scrollTop;
    syncing=false;
  },{passive:true});
  document.addEventListener('focus',e=>{
    if(!e.target.matches||!e.target.matches('input'))return;
    const rbTop=rb.scrollTop;const rbLeft=rb.scrollLeft;const lbTop=lb.scrollTop;
    requestAnimationFrame(()=>{rb.scrollTop=rbTop;rb.scrollLeft=rbLeft;lb.scrollTop=lbTop;});
  },true);
}

function setupRoundTabOrder(){
  document.getElementById('right-body').addEventListener('keydown',e=>{
    if(e.key!=='Tab')return;
    const el=e.target;
    if(!el.dataset.tabRound)return;
    const round=parseInt(el.dataset.tabRound);
    const combIdx=parseInt(el.dataset.tabCombIdx);
    const fieldIdx=parseInt(el.dataset.tabFieldIdx);
    const numCombs=state.combatants.length;
    const fieldsPerComb=5;
    let nr=round,nc=combIdx,nf=fieldIdx;
    if(!e.shiftKey){
      nf++;
      if(nf>=fieldsPerComb){nf=0;nc++;}
      if(nc>=numCombs){nc=0;nr++;}
      if(nr>state.numRounds)return;
    }else{
      nf--;
      if(nf<0){nf=fieldsPerComb-1;nc--;}
      if(nc<0){nc=numCombs-1;nr--;}
      if(nr<1)return;
    }
    const target=document.querySelector(
      '[data-tab-round="'+nr+'"][data-tab-comb-idx="'+nc+'"][data-tab-field-idx="'+nf+'"]'
    );
    if(target){e.preventDefault();target.focus();}
  });
}

function render(){
  const focusId=getActiveFieldId();
  renderHeader();renderLR();renderRoundHeaders();renderRows();updateRoundIndicator();updateRemoveButtons();
  requestAnimationFrame(()=>{syncRowHeights();restoreFocus(focusId);});
}

function mkLbl(t){const s=document.createElement('span');s.className='lbl';s.textContent=t;return s;}
function mkSlash(){const s=document.createElement('span');s.className='slash';s.textContent='/';return s;}
function mkDeathSep(){const s=document.createElement('span');s.className='death-sep';s.textContent='/';return s;}
function mkInput(cls,val,fn,fieldId,ariaLabel){
  const i=document.createElement('input');i.className='info-input '+cls;i.value=val;
  i.inputMode='numeric';
  if(fieldId)i.dataset.fieldId=fieldId;
  if(ariaLabel)i.setAttribute('aria-label',ariaLabel);
  i.addEventListener('input',()=>fn(i.value));return i;
}
function mkChk(extra,checked,fn,ariaLabel){const c=document.createElement('input');c.type='checkbox';
  c.className='chk'+(extra?' '+extra:'');c.checked=checked;
  if(ariaLabel)c.setAttribute('aria-label',ariaLabel);
  c.addEventListener('change',()=>fn(c.checked));return c;}

function syncRowHeights(){
  const lb=document.getElementById('left-body');
  const rb=document.getElementById('right-body');
  const L=[...lb.children];const R=[...rb.children];
  const len=Math.min(L.length,R.length);
  for(let i=0;i<len;i++){L[i].style.height='auto';R[i].style.height='auto';}
  const heights=new Array(len);
  for(let i=0;i<len;i++){heights[i]=Math.max(L[i].offsetHeight,R[i].offsetHeight);}
  for(let i=0;i<len;i++){L[i].style.height=heights[i]+'px';R[i].style.height=heights[i]+'px';}
}

function updateRoundIndicator(){document.getElementById('round-ind').textContent='Round '+state.currentRound;}
function updateRemoveButtons(){
  document.getElementById('btn-rm-combatant').disabled=state.combatants.length<=1;
  document.getElementById('btn-rm-round').disabled=state.numRounds<=1;
}

function addCombatant(){
  state.combatants.push(newCombatant());render();queueSave();
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{
    const rb=document.getElementById('right-body');rb.scrollTop=rb.scrollHeight;
    const lb=document.getElementById('left-body');lb.scrollTop=lb.scrollHeight;
  });});
}
function removeLastCombatant(){
  if(state.combatants.length<=1)return;
  state.combatants.pop();render();queueSave();
}
function removeCombatant(id){state.combatants=state.combatants.filter(c=>c.id!==id);render();queueSave();}
function addRound(){
  state.numRounds++;render();queueSave();
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{
    const rb=document.getElementById('right-body');rb.scrollLeft=rb.scrollWidth;
  });});
}
function removeLastRound(){
  if(state.numRounds<=1)return;
  const r=state.numRounds;
  delete state.lair[r];delete state.legendary[r];
  state.combatants.forEach(c=>{delete c.rounds[r];});
  state.numRounds--;
  if(state.currentRound>state.numRounds)state.currentRound=state.numRounds;
  render();queueSave();
}
function sortByInit(){
  const indexed=state.combatants.map((c,i)=>[c,i]);
  indexed.sort(([a,ai],[b,bi])=>(parseFloat(b.init)||0)-(parseFloat(a.init)||0)||ai-bi);
  state.combatants=indexed.map(([c])=>c);
  render();queueSave();
}
function nextRound(){
  if(state.currentRound<state.numRounds)state.currentRound++;
  else{state.numRounds++;state.currentRound=state.numRounds;}
  render();queueSave();scrollToRound(state.currentRound);
}
function prevRound(){if(state.currentRound>1){state.currentRound--;render();queueSave();scrollToRound(state.currentRound);}}
function scrollToRound(r){
  const cells=document.querySelectorAll('.round-head-inner .head-round');
  if(cells[r-1]){document.getElementById('right-body').scrollLeft=cells[r-1].offsetLeft;}
}
function confirmClear(){

  document.getElementById('btn-modal-cancel').focus();
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('show');}
function doClear(){closeModal();state=defaultState();saveState();render();}

function printExport(){
  const pv=document.getElementById('print-view');
  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const chk=(checked,extra)=>'<span class="p-chk'+(extra?' '+extra:'')+' '+(checked?'checked':'')+'"></span>';

  let maxRound=state.numRounds;
  let usedRounds=Math.max(state.currentRound,1);
  state.combatants.forEach(c=>{
    Object.keys(c.rounds).forEach(r=>{
      const rd=c.rounds[r];
      if(rd&&(rd.action||rd.bonus||rd.reaction||rd.freeLabel||rd.freeDesc))
        usedRounds=Math.max(usedRounds,parseInt(r));
    });
  });
  Object.keys(state.lair).forEach(r=>{
    if(state.lair[r])usedRounds=Math.max(usedRounds,parseInt(r));
  });
  Object.keys(state.legendary).forEach(r=>{
    if((state.legendary[r]||[]).some(Boolean))usedRounds=Math.max(usedRounds,parseInt(r));
  });
  usedRounds=Math.min(usedRounds,maxRound);

  const activeCombatants=state.combatants.filter(c=>
    c.name||c.init||c.ac||c.hp||c.maxHp||c.conc||
    c.deathS.some(Boolean)||c.deathF.some(Boolean)||
    Object.keys(c.rounds).some(r=>{const rd=c.rounds[r];return rd&&(rd.action||rd.bonus||rd.reaction||rd.freeLabel||rd.freeDesc);})
  );
  const rows=activeCombatants.length>0?activeCombatants:state.combatants;

  const infoW=18,initW=4,acW=4;
  const roundW=Math.floor((100-infoW-initW-acW)/usedRounds);

  let h='';
  h+='<div class="p-hdr">';
  h+='<span class="p-title">Combat Log</span>';
  h+='<div class="p-hdr-f grow"><span class="p-lbl">Encounter</span> <span class="p-val">'+esc(state.encounter)+'</span></div>';
  h+='<div class="p-hdr-f grow"><span class="p-lbl">Player</span> <span class="p-val">'+esc(state.player)+'</span></div>';
  h+='<div class="p-hdr-f"><span class="p-lbl">Session</span> <span class="p-val">'+esc(state.session)+'</span></div>';
  h+='<div class="p-hdr-f"><span class="p-lbl">Leg.Res.</span> ';
  for(let i=0;i<5;i++)h+=chk(state.legendaryRes[i]);
  h+='</div></div>';

  h+='<table class="p-table"><colgroup>';
  h+='<col style="width:'+initW+'%"><col style="width:'+acW+'%"><col style="width:'+infoW+'%">';
  for(let r=0;r<usedRounds;r++)h+='<col style="width:'+roundW+'%">';
  h+='</colgroup><thead><tr>';
  h+='<th>Init</th><th>AC</th><th class="al">Combatant Info</th>';
  for(let r=1;r<=usedRounds;r++)h+='<th><span class="p-rn">'+r+'</span></th>';
  h+='</tr></thead><tbody>';

  h+='<tr class="p-lair">';
  h+='<td class="c-init">'+esc(state.lairInit)+'</td>';
  h+='<td class="c-ac"></td>';
  h+='<td class="c-info" style="display:flex;justify-content:space-between;"><span>LAIR</span><span>LEGENDARY ACTIONS</span></td>';
  for(let r=1;r<=usedRounds;r++){
    let lc=chk(state.lair[r]||false);
    lc+=' | ';
    const leg=state.legendary[r]||[false,false,false];
    for(let a=0;a<3;a++)lc+=chk(leg[a]);
    h+='<td class="c-round" style="text-align:center;">'+lc+'</td>';
  }
  h+='</tr>';

  rows.forEach(c=>{
    h+='<tr>';
    h+='<td class="c-init">'+esc(c.init)+'</td>';
    h+='<td class="c-ac">'+esc(c.ac)+'</td>';

    let info='<div style="font-weight:700;font-size:8pt;border-bottom:1px solid #b0b0b0;padding-bottom:1px;margin-bottom:1px;">'+(esc(c.name)||'&nbsp;')+'</div>';
    info+='<div class="p-info-line"><span class="p-lbl">HP</span> '+esc(c.hp)+'/'+esc(c.maxHp);
    if(c.thp)info+=' <span class="p-lbl">THP</span> '+esc(c.thp);
    if(c.spd)info+=' <span class="p-lbl">SPD</span> '+esc(c.spd);
    info+='</div>';
    if(c.conc)info+='<div class="p-info-line"><span class="p-lbl">Conc</span> '+esc(c.conc)+'</div>';

    const hasDs=c.deathS.some(Boolean)||c.deathF.some(Boolean);
    if(hasDs){
      info+='<div class="p-info-line"><span class="p-lbl">Death</span> ';
      for(let s=0;s<3;s++)info+=chk(c.deathS[s],'round');
      info+='/';
      for(let f=0;f<3;f++)info+=chk(c.deathF[f],'round dashed');
      info+='</div>';
    }
    if(c.inspiration)info+='<div class="p-info-line"><span class="p-lbl">INSP</span> '+chk(true)+'</div>';
    h+='<td class="c-info">'+info+'</td>';

    for(let r=1;r<=usedRounds;r++){
      const rd=getRound(c,r);
      let rc='';
      if(rd.action)rc+='<span class="p-tag">A</span> '+esc(rd.action)+'\n';
      if(rd.bonus)rc+='<span class="p-tag">B</span> '+esc(rd.bonus)+'\n';
      if(rd.reaction)rc+='<span class="p-tag">R</span> '+esc(rd.reaction)+'\n';
      if(rd.freeLabel||rd.freeDesc)rc+='<span class="p-tag">'+esc(rd.freeLabel)+'</span> '+esc(rd.freeDesc);
      h+='<td class="c-round">'+rc+'</td>';
    }
    h+='</tr>';
  });

  h+='</tbody></table>';
  pv.innerHTML=h;
  requestAnimationFrame(()=>{requestAnimationFrame(()=>window.print());});
}

setupScrollSync();
setupRoundTabOrder();
render();
window.addEventListener('resize',()=>requestAnimationFrame(syncRowHeights));

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}

</script>
</body>
</html>
